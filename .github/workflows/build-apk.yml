permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read

name: Build LDesk Android APK

on:
  workflow_dispatch:
  push:
    branches: [master,v2.0.0,v2.0.1,v2.0.1-track,v2.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-apk.yml'

env:
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: |
          LDESK_VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "LDESK_VERSION=$LDESK_VERSION" >> $GITHUB_ENV
          echo "Version: $LDESK_VERSION"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-apk-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-apk-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake clang git nasm yasm ninja-build \
            libssl-dev libopus-dev libvpx-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Android signing secrets
        env:
          LUODA_ANDROID_KEYSTORE_BASE64: ${{ secrets.LUODA_ANDROID_KEYSTORE_BASE64 }}
          LUODA_ANDROID_STORE_PASSWORD: ${{ secrets.LUODA_ANDROID_STORE_PASSWORD }}
          LUODA_ANDROID_KEY_ALIAS: ${{ secrets.LUODA_ANDROID_KEY_ALIAS }}
          LUODA_ANDROID_KEY_PASSWORD: ${{ secrets.LUODA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 仓库内已经带了正式签名用的 keystore（见 "Restore stable signing keystore"
          # 步骤），此时 secrets 缺不缺都不影响出包，只做提示。
          if [ -s "flutter/android/app/luoda-release.keystore" ] \
            && [ -s "flutter/android/key.properties" ]; then
            echo "OK: in-repo signing keystore present; Actions signing secrets are optional"
            for name in LUODA_ANDROID_KEYSTORE_BASE64 LUODA_ANDROID_STORE_PASSWORD LUODA_ANDROID_KEY_ALIAS LUODA_ANDROID_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "NOTE: signing secret $name is not set (unused, in-repo keystore wins)"
              fi
            done
            exit 0
          fi

          for name in LUODA_ANDROID_KEYSTORE_BASE64 LUODA_ANDROID_STORE_PASSWORD LUODA_ANDROID_KEY_ALIAS LUODA_ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "ERROR: Android signing secret $name is missing"; exit 1; }
          done

          SIGNING_CHECK="$RUNNER_TEMP/luoda-signing-check.p12"
          trap 'rm -f "$SIGNING_CHECK"' EXIT
          printf '%s' "$LUODA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_CHECK"
          test -s "$SIGNING_CHECK"
          keytool -list \
            -keystore "$SIGNING_CHECK" \
            -storepass "$LUODA_ANDROID_STORE_PASSWORD" \
            -alias "$LUODA_ANDROID_KEY_ALIAS" > /dev/null
          echo "OK: Android signing secrets verified before native compilation"

      - name: Setup Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Ensure correct cargo version
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          cargo --version
          rustup default 1.88

      - name: Configure Git for private forks
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 2.11.0 --locked

      - name: Setup opus headers for Android build
        run: |
          OPUS_INCLUDE=$(pwd)/target/opus-include/opus
          mkdir -p $OPUS_INCLUDE
          wget -q https://raw.githubusercontent.com/xiph/opus/master/include/opus.h -O $OPUS_INCLUDE/opus.h
          wget -q https://raw.githubusercontent.com/xiph/opus/master/include/opus_multistream.h -O $OPUS_INCLUDE/opus_multistream.h
          wget -q https://raw.githubusercontent.com/xiph/opus/master/include/opus_defines.h -O $OPUS_INCLUDE/opus_defines.h
          wget -q https://raw.githubusercontent.com/xiph/opus/master/include/opus_types.h -O $OPUS_INCLUDE/opus_types.h
          wget -q https://raw.githubusercontent.com/xiph/opus/master/include/opus_projection.h -O $OPUS_INCLUDE/opus_projection.h
          ls -la $OPUS_INCLUDE/
          echo "OPUS_INCLUDE_PATH=$(pwd)/target/opus-include" >> $GITHUB_ENV

      - name: Setup vpx headers for Android build
        run: |
          VPX_INCLUDE=$(pwd)/target/vpx-include/vpx
          mkdir -p $VPX_INCLUDE
          BASE_URL="https://raw.githubusercontent.com/webmproject/libvpx/main/vpx"
          for f in vp8.h vp8cx.h vp8dx.h vpx_codec.h vpx_decoder.h vpx_encoder.h vpx_image.h vpx_integer.h vpx_ext_ratectrl.h vpx_tpl.h vpx_frame_buffer.h; do
            wget -q "$BASE_URL/$f" -O "$VPX_INCLUDE/$f" || echo "WARN: failed to download $f"
          done
          ls -la $VPX_INCLUDE/
          echo "VPX_INCLUDE_PATH=$(pwd)/target/vpx-include" >> $GITHUB_ENV

      - name: Register rustls-platform-verifier maven repo
        run: |
          set -euo pipefail
          echo "=== Searching for rustls-platform-verifier maven repo ==="
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          FOUND_DIR=$(find "$CARGO_HOME/registry/src" -type d -name "maven" -path "*rustls-platform-verifier*" 2>/dev/null | head -1)
          if [ -n "$FOUND_DIR" ]; then
            echo "Found: $FOUND_DIR"
            # Add to gradle.properties so it can be used in build.gradle.kts
            echo "rustlsMavenRepo=$FOUND_DIR" >> "$GITHUB_WORKSPACE/flutter/android/gradle.properties"
            echo "OK: rustls Maven repo registered"
          else
            echo "WARN: rustls-platform-verifier maven repo not found, build may fail"
          fi
        shell: bash

      - name: Patch Flutter Gradle plugin for AGP 8.x compatibility
        run: |
          FLUTTER_GRADLE_PLUGIN="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GRADLE_PLUGIN" ]; then
            echo "=== Patching $FLUTTER_GRADLE_PLUGIN ==="
            # OutputFile was removed in AGP 8.0. Replace import with compatible alternative
            sed -i "/import com.android.build.OutputFile/d" "$FLUTTER_GRADLE_PLUGIN"
            # Replace OutputFile.ABI with plain "ABI" (FilterType was also removed in AGP 8.3+)
            sed -i 's/OutputFile\.ABI/"ABI"/g' "$FLUTTER_GRADLE_PLUGIN"
            echo "=== Verification ==="
            if grep -q "OutputFile\|FilterType\.ABI" "$FLUTTER_GRADLE_PLUGIN"; then
              echo "WARN: Unpatched OutputFile/FilterType.ABI references remain"
              grep -n "OutputFile\|FilterType" "$FLUTTER_GRADLE_PLUGIN" | head -10
            else
              echo "OK: Flutter Gradle plugin patched for AGP 8.x"
            fi
          else
            echo "WARN: Flutter Gradle plugin not found at $FLUTTER_GRADLE_PLUGIN"
            find "$FLUTTER_ROOT/packages/flutter_tools/gradle" -name "*.groovy" -exec grep -l "OutputFile" {} \; 2>/dev/null || echo "No OutputFile references found in any Groovy file"
          fi
        shell: bash

      - name: Generate FFI bridge
        timeout-minutes: 20
        run: |
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"

      - name: Build Rust library for Android
        timeout-minutes: 90
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG=${{ env.VCPKG_ROOT }}
          OUT=flutter/android/app/src/main/jniLibs
          OPUS_INCLUDE=${{ env.OPUS_INCLUDE_PATH }}
          VPX_INCLUDE=${{ env.VPX_INCLUDE_PATH }}

          for TARGET_ABI in armeabi-v7a arm64-v8a x86_64; do
            case $TARGET_ABI in
              armeabi-v7a)
                RUST_TARGET=armv7-linux-androideabi
                VCPKG_TRIPLET=arm-neon-android
                ;;
              arm64-v8a)
                RUST_TARGET=aarch64-linux-android
                VCPKG_TRIPLET=arm64-android
                ;;
              x86_64)
                RUST_TARGET=x86_64-linux-android
                VCPKG_TRIPLET=x64-android
                ;;
            esac

            echo "=========================================="
            echo "Building for $TARGET_ABI ($RUST_TARGET)..."
            echo "=========================================="

            echo "Installing vcpkg packages for $VCPKG_TRIPLET..."
            export VCPKG_BINARY_SOURCES="clear;files,$VCPKG/archives,readwrite"
            for i in 1 2 3; do
              echo "vcpkg install attempt $i/3 for $VCPKG_TRIPLET..."
              # timeout 20min: prevent vcpkg from hanging indefinitely
              timeout 2100 $VCPKG/vcpkg install \
                --triplet=$VCPKG_TRIPLET \
                --x-install-root="$VCPKG/installed" \
                --clean-after-build && break
              RET=$?
              if [ $RET -eq 124 ]; then
                echo "vcpkg timed out (20 min), retrying..."
              else
                echo "Attempt $i failed (exit=$RET), retrying in 15s..."
              fi
              sleep 15
            done

            VCPKG_INCLUDE_FLAG=""
            if [ -d "$VCPKG/installed/$VCPKG_TRIPLET/include" ]; then
              VCPKG_INCLUDE_FLAG="-isystem $VCPKG/installed/$VCPKG_TRIPLET/include"
              echo "vcpkg include: $VCPKG/installed/$VCPKG_TRIPLET/include"
            fi

            VCPKG_LIB_FLAG=""
            if [ -d "$VCPKG/installed/$VCPKG_TRIPLET/lib" ]; then
              VCPKG_LIB_FLAG="-Lnative=$VCPKG/installed/$VCPKG_TRIPLET/lib"
              echo "vcpkg lib: $VCPKG/installed/$VCPKG_TRIPLET/lib"
            fi

            BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I$OPUS_INCLUDE -I$VPX_INCLUDE $VCPKG_INCLUDE_FLAG" \
            CFLAGS="-I$OPUS_INCLUDE -I$VPX_INCLUDE $VCPKG_INCLUDE_FLAG" \
            CXXFLAGS="-I$OPUS_INCLUDE -I$VPX_INCLUDE $VCPKG_INCLUDE_FLAG -include cstdint" \
            VCPKG_INSTALLED_ROOT="$VCPKG/installed/$VCPKG_TRIPLET" \
            RUSTFLAGS="$VCPKG_LIB_FLAG" \
            cargo ndk -t $TARGET_ABI -o $OUT build --release --features flutter --features use_dasp --features mediacodec --target $RUST_TARGET

            echo "OK: $TARGET_ABI build complete"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

      - name: Copy libc++_shared.so to jniLibs
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          OUT=flutter/android/app/src/main/jniLibs
          for TARGET_ABI in armeabi-v7a arm64-v8a x86_64; do
            case $TARGET_ABI in
              armeabi-v7a) NDK_LIBCXX="arm-linux-androideabi" ;;
              arm64-v8a)   NDK_LIBCXX="aarch64-linux-android" ;;
              x86_64)      NDK_LIBCXX="x86_64-linux-android" ;;
            esac
            NDK_LIBCXX_PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$NDK_LIBCXX/libc++_shared.so"
            if [ -f "$NDK_LIBCXX_PATH" ]; then
              cp "$NDK_LIBCXX_PATH" "$OUT/$TARGET_ABI/"
              echo "Copied libc++_shared.so for $TARGET_ABI"
            else
              echo "ERROR: libc++_shared.so not found at $NDK_LIBCXX_PATH - APK will crash on launch without it"
              exit 1
            fi
          done

      - name: Flutter pub get
        run: |
          cd flutter
          flutter pub get
      - name: Run Flutter tests
        continue-on-error: true
        run: |
          cd flutter
          flutter test --reporter expanded

      - name: Run Flutter analyze
        continue-on-error: true
        run: |
          cd flutter
          flutter analyze --no-fatal-infos --no-fatal-warnings


      - name: Generate Flutter Rust Bridge code
        run: |
          cd flutter
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate APK icons from mac-icon.png
        run: |
          pip3 install pillow
          python3 res/resize_for_apk.py
          echo "=== Verifying generated icons ==="
          ls -la flutter/android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          ls -la flutter/android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          ls -la flutter/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          ls -la flutter/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Fix plugin Kotlin/Java JVM target compatibility
        run: python3 flutter/android/fix_jvm.py
        shell: bash

      - name: Fix AGP 8.x compatibility issues in plugin build.gradle files
        run: python3 flutter/android/fix_plugin_agp8_compat.py
        shell: bash

      - name: Restore stable signing keystore
        env:
          LUODA_ANDROID_KEYSTORE_BASE64: ${{ secrets.LUODA_ANDROID_KEYSTORE_BASE64 }}
          LUODA_ANDROID_STORE_PASSWORD: ${{ secrets.LUODA_ANDROID_STORE_PASSWORD }}
          LUODA_ANDROID_KEY_ALIAS: ${{ secrets.LUODA_ANDROID_KEY_ALIAS }}
          LUODA_ANDROID_KEY_PASSWORD: ${{ secrets.LUODA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # 签名必须用"设备上已装 APK 的那把钥匙"。
          # 否则 adb install -r / 应用内更新会报
          #   INSTALL_FAILED_UPDATE_INCOMPATIBLE: signatures do not match
          # 用户只能卸载重装，配置全丢。
          #
          # 实测：仓库里自带的 luoda-release.keystore（alias=luoda，DN
          # CN=LUODA,OU=LUODA,O=LUODA）才是手机上装着的那把；Actions secrets
          # 里的另一把（DN OU=Mobile,O=LUODA,CN=LUODA Android Release）签名不符。
          # 仓库里的 keystore 与 key.properties 本来就被 git 跟踪（历史遗留），
          # 所以这里优先用它，保证 CI 产物可以直接原地升级。
          # ------------------------------------------------------------------
          REPO_KEYSTORE="flutter/android/app/luoda-release.keystore"
          REPO_PROPS="flutter/android/key.properties"
          if [ -s "$REPO_KEYSTORE" ] && [ -s "$REPO_PROPS" ]; then
            R_STORE_FILE="$(sed -n 's/^storeFile=//p' "$REPO_PROPS" | tr -d '\r')"
            R_ALIAS="$(sed -n 's/^keyAlias=//p' "$REPO_PROPS" | tr -d '\r')"
            R_PASS="$(sed -n 's/^storePassword=//p' "$REPO_PROPS" | tr -d '\r')"
            if [ -n "$R_STORE_FILE" ] && [ -n "$R_ALIAS" ] && [ -n "$R_PASS" ] \
              && keytool -list -keystore "$REPO_KEYSTORE" -storepass "$R_PASS" -alias "$R_ALIAS" > /dev/null 2>&1; then
              echo "OK: using in-repo keystore '$R_STORE_FILE' (alias=$R_ALIAS) — matches installed app"
              echo "=== signing cert fingerprint ==="
              keytool -list -v -keystore "$REPO_KEYSTORE" -storepass "$R_PASS" -alias "$R_ALIAS" 2>/dev/null \
                | grep -E "SHA256:|SHA-256:" | head -2 || true
              exit 0
            fi
            echo "WARN: in-repo keystore present but unusable, falling back to Actions secrets"
          else
            echo "WARN: in-repo keystore/key.properties missing, falling back to Actions secrets"
          fi

          missing_secret=false
          for name in LUODA_ANDROID_KEYSTORE_BASE64 LUODA_ANDROID_STORE_PASSWORD LUODA_ANDROID_KEY_ALIAS LUODA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing_secret=true
            fi
          done

          if [ "$missing_secret" = true ]; then
            echo "ERROR: Android signing secrets are incomplete"
            exit 1
          fi

          KEYSTORE_FILE="flutter/android/app/keystore.jks"
          TEMP_KEYSTORE_FILE="${KEYSTORE_FILE}.tmp"
          if ! printf '%s' "$LUODA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TEMP_KEYSTORE_FILE" \
            || ! test -s "$TEMP_KEYSTORE_FILE" \
            || ! keytool -list \
              -keystore "$TEMP_KEYSTORE_FILE" \
              -storepass "$LUODA_ANDROID_STORE_PASSWORD" \
              -alias "$LUODA_ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            rm -f "$TEMP_KEYSTORE_FILE"
            echo "ERROR: Android signing secrets are invalid"
            exit 1
          fi

          mv "$TEMP_KEYSTORE_FILE" "$KEYSTORE_FILE"
          echo "storeFile=keystore.jks" > flutter/android/key.properties
          echo "storePassword=$LUODA_ANDROID_STORE_PASSWORD" >> flutter/android/key.properties
          echo "keyAlias=$LUODA_ANDROID_KEY_ALIAS" >> flutter/android/key.properties
          echo "keyPassword=$LUODA_ANDROID_KEY_PASSWORD" >> flutter/android/key.properties
          echo "OK: Stable Android signing keystore restored from Actions secrets"
        shell: bash

      - name: Verify signing config
        run: |
          set -euo pipefail
          grep -E '^(storeFile|keyAlias)=' flutter/android/key.properties
          KEYSTORE_NAME="$(sed -n 's/^storeFile=//p' flutter/android/key.properties | tr -d '\r')"
          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' flutter/android/key.properties | tr -d '\r')"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' flutter/android/key.properties | tr -d '\r')"
          test -n "$KEYSTORE_NAME"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          keytool -list \
            -keystore "flutter/android/app/$KEYSTORE_NAME" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "OK: Android signing key verified"
        shell: bash

      - name: Build APK (split per ABI)
        timeout-minutes: 30
        run: |
          cd flutter
          flutter build apk --release --split-per-abi \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Build APK (universal)
        timeout-minutes: 15
        run: |
          cd flutter
          flutter build apk --release \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Collect APK outputs
        run: |
          set -euo pipefail
          APK_ROOT=flutter/build
          DIST_DIR=flutter/build/app/outputs/dist-apk
          mkdir -p "$DIST_DIR"
          echo "=== APK outputs ==="
          find "$APK_ROOT" -type f -name "*.apk" -print -exec ls -lh {} \; || true

          mapfile -t apks < <(find "$APK_ROOT" -type f -name "*.apk")
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: no APK files produced under $APK_ROOT"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            case "$name" in
              app-release.apk) out="LDesk-universal.apk" ;;
              app-armeabi-v7a-release.apk) out="LDesk-armeabi-v7a.apk" ;;
              app-arm64-v8a-release.apk) out="LDesk-arm64-v8a.apk" ;;
              app-x86_64-release.apk) out="LDesk-x86_64.apk" ;;
              *) out="LDesk-${name#app-}" ;;
            esac
            cp "$apk" "$DIST_DIR/$out"
          done

          echo "=== Collected APK artifacts ==="
          ls -lh "$DIST_DIR"/*.apk

      - name: Verify APK native libraries and signatures
        run: |
          set -euo pipefail
          DIST_DIR=flutter/build/app/outputs/dist-apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          verify_native_lib() {
           apk="$1"
           abi="$2"
           missing=""
           if ! unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libluoda.so"; then
           echo "ERROR: $(basename "$apk") is missing lib/$abi/libluoda.so"
           missing=1
           fi
           if ! unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libc++_shared.so"; then
           echo "ERROR: $(basename "$apk") is missing lib/$abi/libc++_shared.so (causes startup crash)"
           missing=1
           fi
           if [ -n "$missing" ]; then exit 1; fi
           }

          verify_native_lib "$DIST_DIR/LDesk-armeabi-v7a.apk" "armeabi-v7a"
          verify_native_lib "$DIST_DIR/LDesk-arm64-v8a.apk" "arm64-v8a"
          verify_native_lib "$DIST_DIR/LDesk-x86_64.apk" "x86_64"
          verify_native_lib "$DIST_DIR/LDesk-universal.apk" "armeabi-v7a"
          verify_native_lib "$DIST_DIR/LDesk-universal.apk" "arm64-v8a"
          verify_native_lib "$DIST_DIR/LDesk-universal.apk" "x86_64"

          for apk in "$DIST_DIR"/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          echo "OK: every APK contains libluoda.so + libc++_shared.so and has a valid signature"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-APK
          path: flutter/build/app/outputs/dist-apk/*.apk
          if-no-files-found: error

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${LDESK_VERSION}"
          # 与 EXE 工作流共用同一个 tag。谁先跑完谁建 release，后来者复用 + clobber，
          # 不再因为 release 已存在而失败（旧 softprops/action-gh-release@v1 会抛
          # already_exists）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading assets into it"
          else
            gh release create "$TAG" --title "$TAG" --notes "LDesk $TAG" --latest
          fi
          shopt -s nullglob
          files=(flutter/build/app/outputs/dist-apk/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no APK assets produced"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "=== release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-apk
          path: .auto_build_logs/
          if-no-files-found: ignore
