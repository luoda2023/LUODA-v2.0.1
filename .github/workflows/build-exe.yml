name: Build LDesk Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [master, v2.0.0, v2.0.1, v2.0.1-track, 2.1.1]
    paths:
      - 'build.rs'
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'res/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vcpkg.json'
      - '.github/workflows/build-exe.yml'
permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read
jobs:
  build-exe:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        shell: bash
        run: |
          LDESK_VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "LDESK_VERSION=$LDESK_VERSION" >> $GITHUB_ENV
          echo "Version: $LDESK_VERSION"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-exe-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-exe-${{ matrix.arch }}-${{ runner.os }}-
      - name: Setup Flutter
        if: matrix.arch == 'x64'
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.88'
          targets: ${{ matrix.arch == 'x86' && 'i686-pc-windows-msvc' || '' }}
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Ensure correct cargo version
        run: |
          rustup default 1.88
          cargo --version
      - name: Test host startup policy
        shell: bash
        run: |
          rustc --test src/host_startup.rs -o host-startup-tests.exe
          ./host-startup-tests.exe
      - name: Configure Git for private forks
        shell: bash
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Generate FFI bridge
        if: matrix.arch == 'x64'
        timeout-minutes: 20
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "=== Installing cargo-expand ==="
          cargo install cargo-expand --version 1.0.95 --locked 2>&1 | tail -5
          echo "=== Installing flutter_rust_bridge_codegen ==="
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked 2>&1 | tail -5
          echo "=== Running flutter pub get ==="
          cd flutter && flutter pub get && cd ..
          echo "=== Running flutter_rust_bridge_codegen ==="
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart 2>&1
          echo "=== Verifying generated file ==="
          ls -la flutter/lib/generated_bridge.dart || echo "ERROR: generated_bridge.dart not created!"
          head -5 flutter/lib/generated_bridge.dart || echo "ERROR: Cannot read file!"
      - name: Setup vcpkg
        # lukka/run-vcpkg@v11 已在 GitHub Marketplace unpublished,
        # 改为直接 git clone vcpkg + 调 vcpkg install (自带 vcpkgGitCommitId)。
        shell: bash
        run: |
          if [ ! -d "C:/vcpkg" ]; then
            git clone https://github.com/Microsoft/vcpkg.git C:/vcpkg
          fi
          cd C:/vcpkg
          git fetch origin
          git checkout 120deac3062162151622ca4860575a33844ba10b
          ./bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=C:/vcpkg" >> $GITHUB_ENV
          echo "C:/vcpkg" >> $GITHUB_PATH
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-exe-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-exe-${{ matrix.arch }}-${{ runner.os }}-
      - name: Install vcpkg deps
        timeout-minutes: 40
        shell: bash
        run: |
          triplet="${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}"
          vcpkg install --triplet "$triplet" --x-install-root="$VCPKG_ROOT/installed"
      - name: Build Rust
        timeout-minutes: 50
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            cargo build --release --target i686-pc-windows-msvc
          else
            cargo build --release --features flutter
          fi
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}
          CXXFLAGS: -include cstdint
          SODIUM_LIB_DIR: C:\vcpkg\installed\${{ matrix.arch == 'x86' && 'x86-windows-static' || 'x64-windows-static' }}\lib
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '5.x'
      - name: Build Flutter Windows
        if: matrix.arch == 'x64'
        timeout-minutes: 15
        run: |
          cd flutter
          flutter clean
          flutter build windows --release
      - name: Sign executable with LDesk icon
        # 图标是纯装饰。这一步曾因 `rcedit` 不在 PATH（choco 装完 shim 未刷新到已
        # 初始化的 bash 环境）报 exit 127，而 x64 分支又没有 `|| true`，直接让
        # 整个 2.2.33 发布构建挂掉（run #960，steps 18）。现在两步加固：
        #   1. 显式把 chocolatey 的 bin 加进 PATH；
        #   2. 无论 rcedit 是否可用，这一步都返回 0，绝不阻断产物上传。
        shell: bash
        run: |
          set +e
          export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          if ! command -v rcedit >/dev/null 2>&1; then
            choco install rcedit -y >/dev/null 2>&1
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          fi
          if ! command -v rcedit >/dev/null 2>&1; then
            echo "::warning::rcedit 不可用，保留默认图标（不阻断构建）"
            exit 0
          fi
          if [ "${{ matrix.arch }}" = "x86" ]; then
            rcedit "target/i686-pc-windows-msvc/release/luoda.dll" --set-icon "res/icon.ico" || true
            rcedit "target/i686-pc-windows-msvc/release/service.exe" --set-icon "res/icon.ico" || true
            rcedit "target/i686-pc-windows-msvc/release/naming.exe" --set-icon "res/icon.ico" || true
          else
            rcedit "flutter/build/windows/x64/runner/Release/LDesk.exe" --set-icon "res/icon.ico" \
              || echo "::warning::rcedit 设置图标失败，保留默认图标"
          fi
          exit 0
      - name: Build portable packer
        timeout-minutes: 15
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            RUST_TARGET="i686-pc-windows-msvc"
            mkdir -p SignOutput
            if [ -f "target/${RUST_TARGET}/release/service.exe" ]; then
              cp "target/${RUST_TARGET}/release/service.exe" SignOutput/LDesk-service-x86.exe
            fi
            if [ -f "target/${RUST_TARGET}/release/naming.exe" ]; then
              cp "target/${RUST_TARGET}/release/naming.exe" SignOutput/LDesk-naming-x86.exe
            fi
            echo "=== x86 CLI executables ==="
            ls -la SignOutput/
          else
            mkdir -p Release
            cp -r flutter/build/windows/x64/runner/Release/* Release/
            if [ ! -f "Release/sciter.dll" ]; then
              echo "=== Downloading sciter.dll ==="
              SCITER_URL="https://github.com/c-smile/sciter-sdk/raw/master/bin/windows/x64/sciter.dll"
              for i in 1 2 3; do
                if curl -sL -o Release/sciter.dll "$SCITER_URL"; then
                  echo "sciter.dll downloaded successfully"
                  break
                fi
                echo "Attempt $i failed, retrying..."
                sleep 3
              done
            fi
            ls -la Release/sciter.dll 2>/dev/null || echo "WARN: sciter.dll not found!"
            echo "=== Adding signed headless display driver ==="
            DRIVER_ZIP="usbmmidd_v2.zip"
            DRIVER_SHA256="629b51e9944762bae73948171c65d09a79595cf4c771a82ebc003fbba5b24f51"
            curl -fL --retry 3 --retry-delay 3 -o "$DRIVER_ZIP" "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip"
            echo "$DRIVER_SHA256  $DRIVER_ZIP" | sha256sum -c -
            unzip -q "$DRIVER_ZIP" -d Release
            test -f Release/usbmmidd_v2/usbmmIdd.inf
            test -f Release/usbmmidd_v2/usbmmidd.cat
            test -f Release/usbmmidd_v2/x64/usbmmIdd.dll
            test -f Release/usbmmidd_v2/License.txt
            echo "=== Adding printer driver adapter ==="
            PRINTER_ZIP="res/drivers/printer_driver_adapter.zip"
            PRINTER_SHA256="e90e5d52c8807b4c6293c78a52479338715e0bf396b1b34802777b8c452e6781"
            test -f "$PRINTER_ZIP"
            echo "$PRINTER_SHA256  $PRINTER_ZIP" | sha256sum -c -
            unzip -q "$PRINTER_ZIP" -d Release
            test -f Release/printer_driver_adapter.dll
            echo "=== Release directory ==="
            ls -la Release/
            pip3 install brotli
            cd libs/portable
            python3 generate.py -f ../../Release/ -o . -e ../../Release/LDesk.exe
            cd ../..
            cd libs/portable
            cargo build --release
            cd ../..
            mkdir -p SignOutput
            cp target/release/luoda-portable-packer.exe SignOutput/LDesk-portable-x64.exe
            cp target/release/luoda-portable-packer.exe SignOutput/LDesk-install.exe
            7z a -tzip SignOutput/LDesk-service-x64.zip ./Release/*
            echo "=== Final Windows EXEs ==="
            ls -la SignOutput/LDesk-portable-x64.exe SignOutput/LDesk-install.exe SignOutput/LDesk-service-x64.zip
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDesk-Portable-${{ matrix.arch }}
          path: SignOutput/
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-${{ matrix.arch }}
          path: .auto_build_logs/
          if-no-files-found: ignore
      - name: Upload to Release (nightly x64 only)
        if: matrix.arch == 'x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${LDESK_VERSION}"
          # EXE 工作流与 APK 工作流会并行给同一个 tag 发版，谁先跑完谁建 release。
          # 后来者必须复用已有 release 并用 --clobber 覆盖资产 —— 旧的
          # softprops/action-gh-release@v1 遇到 tag/release 已存在会直接抛
          # already_exists 失败。v2.2.33 / v2.2.35 的 EXE 就是这样反复发布失败、
          # Release 里只有 APK 没有 exe 的。
          #
          # ★ 必须带 --target "$GITHUB_SHA"：gh release create 不带 --target 会把 tag
          #   建在**仓库默认分支**的 HEAD 上（本仓库默认分支是 v2.0.1），与产出这些
          #   产物的 v2.0.1-track 代码无关 —— 这就是 v2.2.17~v2.2.40 共 23 个 tag
          #   全部指向同一个 dac8fef9 的原因。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading assets into it"
          else
            gh release create "$TAG" --title "$TAG" --notes "LDesk $TAG" --latest \
              --target "$GITHUB_SHA"
          fi
          # 身份自检：tag 必须指向本次构建的提交，否则产物与 tag 对不上（不硬失败，
          # 因为重跑一个旧 tag 是合法场景，但绝不允许静默）。
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::warning title=tag/产物不同源::tag $TAG 指向 $TAG_SHA，但本次构建是 $GITHUB_SHA"
          fi

          files=()
          for f in \
            SignOutput/LDesk-portable-x64.exe \
            SignOutput/LDesk-install.exe \
            SignOutput/LDesk-service-x64.zip ; do
            if [ -s "$f" ]; then files+=("$f"); else echo "WARN: missing asset $f"; fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no release assets produced"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "=== release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
